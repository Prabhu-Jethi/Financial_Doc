services:
  # ============================================================================
  # Backend API Microservice (FastAPI + Python 3.12)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docintel-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - docintel-network

  # ============================================================================
  # Frontend Application (Next.js 14 SSR)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://tjgxwbkqqmeukyxmeuam.supabase.co}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqZ3h3YmtxcW1ldWt5eG1ldWFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5OTk2NDMsImV4cCI6MjEwNjU3NTY0M30.thrAn211lBny9K7ND7wvjsKZq7vkbCz5LfTZ4ih_PmI}
    container_name: docintel-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Internal Docker DNS: Next.js server calls backend directly via service name
      - FASTAPI_BASE_URL=http://backend:8000
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://tjgxwbkqqmeukyxmeuam.supabase.co}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqZ3h3YmtxcW1ldWt5eG1ldWFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5OTk2NDMsImV4cCI6MjEwNjU3NTY0M30.thrAn211lBny9K7ND7wvjsKZq7vkbCz5LfTZ4ih_PmI}
    volumes:
      # Mount SEC 10-K filings for disk-level fallback provenance viewing
      - ./data/originals:/data/originals:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - docintel-network

networks:
  docintel-network:
    driver: bridge

